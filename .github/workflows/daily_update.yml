name: Daily Video Update

on:
  schedule:
    # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install yt-dlp

      - name: Run update script
        run: |
          python scripts/update_videos.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/javascripts/poem-ids.json assets/javascripts/poem-ids-small.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated video list update" && git push)
